name: Kall-Android-Production-Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Production Worker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      # 🚨 SPY AGENT INJECTED HERE: यह बिल्ड भी करेगा और फेल होने पर एरर भी निकालेगा!
      - name: Compile, Assemble & Spy Agent 🕵️‍♂️
        run: |
          echo "Starting build and capturing logs..."
          gradle assembleDebug --stacktrace --info --no-daemon > full_build_log.txt 2>&1 || {
            echo "❌ Build Failed! Spy Agent is extracting the error..."
            echo "### 🕵️‍♂️ Spy Agent Error Report" >> $GITHUB_STEP_SUMMARY
            echo "मुझे तुम्हारे कोड में ये असली मुजरिम मिले हैं:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: " full_build_log.txt >> $GITHUB_STEP_SUMMARY || true
            grep -A 3 -i "AAPT: error:" full_build_log.txt >> $GITHUB_STEP_SUMMARY || true
            grep -E "Execution failed for task" full_build_log.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1 
          }

      # जासूस का पूरा लॉग सेव करने के लिए (ताकि हम गहराई से चेक कर सकें)
      - name: Upload Spy Agent Full Log (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spy-agent-full-log
          path: full_build_log.txt
          retention-days: 3

      - name: Upload Build Reports (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: app/build/reports/
          retention-days: 3

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kall-worker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
